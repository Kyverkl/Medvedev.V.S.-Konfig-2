[project]
name = "depvis"
version = "0.1.0"
description = "Dependency graph visualizer for Cargo (variant 18)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
depvis = "depvis:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
